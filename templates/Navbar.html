{% set ep = request.endpoint %}
{% set en_analisis = ep in dimensiones.values()|map(attribute='endpoint')|list %}
<nav class="navbar navbar-expand-lg barra">
  <div class="container">
    <a class="navbar-brand marca" href="{{ url_for('inicio') }}">{{ nombre_proyecto }}</a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse"
            data-bs-target="#menuPrincipal" aria-controls="menuPrincipal"
            aria-expanded="false" aria-label="Abrir menú de navegación">
      <span class="navbar-toggler-icon"></span>
    </button>

    <div class="collapse navbar-collapse" id="menuPrincipal">
      <ul class="navbar-nav ms-auto">
        <li class="nav-item">
          <a class="nav-link {{ 'active' if ep == 'inicio' }}"
             {% if ep == 'inicio' %}aria-current="page"{% endif %}
             href="{{ url_for('inicio') }}">Inicio</a>
        </li>
        <li class="nav-item dropdown">
          <a class="nav-link dropdown-toggle {{ 'active' if en_analisis }}" href="#"
             role="button" data-bs-toggle="dropdown" aria-expanded="false">Análisis de datos</a>
          <ul class="dropdown-menu dropdown-menu-end">
            {% for d in dimensiones.values() %}
            <li>
              <a class="dropdown-item {{ 'active' if ep == d.endpoint }}"
                 {% if ep == d.endpoint %}aria-current="page"{% endif %}
                 href="{{ url_for(d.endpoint) }}">{{ d.nombre }}</a>
            </li>
            {% endfor %}
          </ul>
        </li>
      </ul>
    </div>
  </div>
</nav>
