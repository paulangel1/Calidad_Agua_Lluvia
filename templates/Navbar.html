{% set ep = request.endpoint %}
<nav class="navbar navbar-expand-lg barra">
  <div class="container">
    <a class="navbar-brand marca" href="{{ url_for('inicio') }}">
      <svg class="marca-icono" viewBox="0 0 40 40" aria-hidden="true">
        <path d="M20 3C15 11 8 18 8 25a12 12 0 0 0 24 0c0-7-7-14-12-22Z" fill="currentColor"/>
        <path d="M13 26c0 4 3 7 7 7" fill="none" stroke="#fffefa" stroke-linecap="round" stroke-width="2"/>
        <path d="M27 16c3 4 5 7 5 10" fill="none" stroke="#a8d65c" stroke-linecap="round" stroke-width="2"/>
      </svg>
      <span>{{ nombre_proyecto }}</span>
    </a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse"
            data-bs-target="#menuPrincipal" aria-controls="menuPrincipal"
            aria-expanded="false" aria-label="Abrir menú de navegación">
      <span class="navbar-toggler-icon"></span>
    </button>

    <div class="collapse navbar-collapse" id="menuPrincipal">
      <ul class="navbar-nav ms-auto">
        <li class="nav-item">
          <a class="nav-link dimension-tab dimension-tab--inicio {{ 'active' if ep == 'inicio' }}"
             {% if ep == 'inicio' %}aria-current="page"{% endif %}
             href="{{ url_for('inicio') }}">Inicio</a>
        </li>
        {% for d in dimensiones.values() %}
        <li class="nav-item">
          <a class="nav-link dimension-tab dimension-tab--{{ d.clase }} {{ 'active' if ep == d.endpoint }}"
             {% if ep == d.endpoint %}aria-current="page"{% endif %}
             href="{{ url_for(d.endpoint) }}">{{ d.nombre }}</a>
        </li>
        {% endfor %}
      </ul>
    </div>
  </div>
</nav>
